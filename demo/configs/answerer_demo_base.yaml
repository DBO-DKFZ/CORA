# Demo answer generation, no-retrieval baseline. Questions are read from the same
# retrieval records, but the context is withheld from the model (rag_mode: false).

# --- Input ---
rag_mode: false
open_ended: false
retrieved_docs_dir: "demo/outputs/retrieved_docs_demo_reranked/"
sufficient_only: false

# --- Model ---
model: "gpt-5-mini"
provider: "openai"
local_base_url: "http://localhost:8000/v1"
max_tokens: 1024

# --- Output ---
output_file: "demo/outputs/results_demo_base.csv"
verbose: true
