input_json: "/home/t252a/data/derma/medqa_derma_final.json"
output_dir: "results/retrieved_docs_medqa_qwenagent/"
verbose: true

# ChromaDB
chroma_path: "chromadb_snowflakev2"
collection_name: "eadv_guidelines"
books_collection_name: "books"

# Embedding
embed_model: "Snowflake/snowflake-arctic-embed-l-v2.0"
topk: 10 # This is the k for each retrieval, so total docs could be higher if multiple query decompositions are generated.

# Agent
agent_model: "Qwen/Qwen3-235B-A22B-Instruct-2507-tput"
provider: "together"  # together | openai | local
local_base_url: "http://localhost:8000/v1"
max_iterations: 3
enable_query_decomposition: true
enable_self_critique: true
confidence_threshold: 0.5

# Set to true to re-run questions that had JSON parse failures in a previous run
rerun_fallbacks: true
