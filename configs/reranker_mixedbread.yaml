input_dir: ./results/retrieved_docs_pubmed_qwenagent
output_dir: ./results/retrieved_docs_pubmed_qwenagent_reranked
reranker_model: mixedbread-ai/mxbai-rerank-large-v1

# Keep only the top N docs after reranking (omit or set null to keep all)
top_k: 10

batch_size: 16
verbose: true

# Set to true to rerank only records where final_sufficient is true (default: rerank all)
sufficient_only: true
